name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-slice:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja openssl@3 nlohmann-json

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          cache: true
          modules: 'qtcharts'

      - name: Configure
        run: |
          cmake -S . -B build-macos -G Ninja \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix openssl@3)" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package
        run: |
          # Set up library paths for macdeployqt to find Homebrew dependencies
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          
          macdeployqt build-macos/dnsbench.app \
            -always-overwrite \
            -verbose=1 \
            -codesign=-
          
          # Ensure Info.plist is writable and set version
          chmod 644 build-macos/dnsbench.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 13.0" build-macos/dnsbench.app/Contents/Info.plist || true
          
          # Final signing pass to ensure everything is covered
          codesign --force --deep --sign - build-macos/dnsbench.app
          
          ditto -c -k --keepParent build-macos/dnsbench.app "dnsbench-macos-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-macos-${{ matrix.arch }}
          path: dnsbench-macos-${{ matrix.arch }}.zip

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf "dist/linux-${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target linux-artifacts \
            --output "type=local,dest=dist/linux-${{ matrix.arch }}" \
            .

      - name: Package
        run: chmod +x "dist/linux-${{ matrix.arch }}/dnsbench/dnsbench"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/dnsbench/

  windows:
    name: Windows amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf dist/windows
          docker buildx build \
            --platform linux/amd64 \
            --target windows-artifacts \
            --output type=local,dest=dist/windows \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-windows-amd64
          path: dist/windows/

  publish:
    name: Publish DNSBench release
    needs: [macos-slice, linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Prepare Release Assets
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          mkdir -p dist/release

          # Linux
          for arch in amd64 arm64; do
            if [ -d "dist/artifacts/dnsbench-linux-$arch" ]; then
              (cd "dist/artifacts/dnsbench-linux-$arch" && zip -r "$GITHUB_WORKSPACE/dist/release/dnsbench-linux-$arch.zip" .)
            fi
          done

          # Windows
          if [ -d "dist/artifacts/dnsbench-windows-amd64" ]; then
            # The portable zip: rename 'dist' to 'dnsbench' inside the zip
            if [ -d "dist/artifacts/dnsbench-windows-amd64/dist" ]; then
              mkdir -p dist/release/dnsbench
              cp -r dist/artifacts/dnsbench-windows-amd64/dist/* dist/release/dnsbench/
              (cd dist/release && zip -r "dnsbench-windows-amd64.zip" dnsbench)
              rm -rf dist/release/dnsbench
            fi
            # The installer: publish as loose EXE
            if [ -f "dist/artifacts/dnsbench-windows-amd64/dnsbench-setup.exe" ]; then
              cp "dist/artifacts/dnsbench-windows-amd64/dnsbench-setup.exe" dist/release/
            fi
          fi

          # macOS (already zipped in the job to preserve metadata/permissions)
          find dist/artifacts -name 'dnsbench-macos-*.zip' -exec cp {} dist/release/ \;

      - name: Publish DNSBench ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/release/* \
            --verify-tag \
            --title "DNSBench $TAG_NAME" \
            --generate-notes \
            --notes "Prebuilt DNSBench packages for Linux, macOS, and Windows are attached below. See the README for platform-specific installation notes."
