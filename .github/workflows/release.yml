name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt openssl@3 nlohmann-json

      - name: Configure
        run: |
          cmake -S . -B build-macos -G Ninja \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix openssl@3)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build-macos/dnsbench.app -always-overwrite
          codesign --force --deep --sign - build-macos/dnsbench.app
          file build-macos/dnsbench.app/Contents/MacOS/dnsbench
          mkdir -p dist/packages
          ditto -c -k --keepParent build-macos/dnsbench.app dist/packages/dnsbench-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-macos-arm64
          path: dist/packages/dnsbench-macos-arm64.zip

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf "dist/linux-${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target linux-artifacts \
            --output "type=local,dest=dist/linux-${{ matrix.arch }}" \
            .

      - name: Package
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p dist/packages
          chmod +x "dist/linux-${{ matrix.arch }}/dnsbench"
          (cd "dist/linux-${{ matrix.arch }}" && zip -r "../packages/dnsbench-linux-${{ matrix.arch }}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-linux-${{ matrix.arch }}
          path: dist/packages/dnsbench-linux-${{ matrix.arch }}.zip

  windows:
    name: Windows amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf dist/windows
          docker buildx build \
            --platform linux/amd64 \
            --target windows-artifacts \
            --output type=local,dest=dist/windows \
            .

      - name: Package
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p dist/packages
          (cd dist/windows && zip -r ../packages/dnsbench-windows-amd64.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-windows-amd64
          path: dist/packages/dnsbench-windows-amd64.zip

  publish:
    name: Publish GitHub release
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find dist/artifacts -name '*.zip' -type f | sort)
          gh release create "$TAG_NAME" \
            "${files[@]}" \
            --title "$TAG_NAME" \
            --notes "Unsigned DNSBench release artifacts."
