name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-slice:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt openssl@3 nlohmann-json

      - name: Configure
        run: |
          cmake -S . -B build-macos -G Ninja \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix openssl@3)" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build-macos/dnsbench.app -always-overwrite
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 12.0" build-macos/dnsbench.app/Contents/Info.plist || true
          codesign --force --deep --sign - build-macos/dnsbench.app
          ditto -c -k --keepParent build-macos/dnsbench.app "dnsbench-macos-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-macos-${{ matrix.arch }}
          path: dnsbench-macos-${{ matrix.arch }}.zip

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf "dist/linux-${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target linux-artifacts \
            --output "type=local,dest=dist/linux-${{ matrix.arch }}" \
            .

      - name: Package
        run: |
          chmod +x "dist/linux-${{ matrix.arch }}/dnsbench"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/dnsbench

  windows:
    name: Windows amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          rm -rf dist/windows
          docker buildx build \
            --platform linux/amd64 \
            --target windows-artifacts \
            --output type=local,dest=dist/windows \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsbench-windows-amd64
          path: dist/windows/

  publish:
    name: Publish GitHub release
    needs: [macos-slice, linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Prepare Release Assets
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          mkdir -p dist/release

          # Linux
          for arch in amd64 arm64; do
            if [ -f "dist/artifacts/dnsbench-linux-$arch/dnsbench" ]; then
              chmod +x "dist/artifacts/dnsbench-linux-$arch/dnsbench"
              zip -j "dist/release/dnsbench-linux-$arch.zip" "dist/artifacts/dnsbench-linux-$arch/dnsbench"
            fi
          done

          # Windows
          if [ -d "dist/artifacts/dnsbench-windows-amd64" ]; then
            # The portable zip
            if [ -d "dist/artifacts/dnsbench-windows-amd64/dist" ]; then
              (cd dist/artifacts/dnsbench-windows-amd64/dist && zip -r "../../../release/dnsbench-windows-amd64.zip" .)
            fi
            # The installer
            if [ -f "dist/artifacts/dnsbench-windows-amd64/dnsbench-setup.exe" ]; then
              cp "dist/artifacts/dnsbench-windows-amd64/dnsbench-setup.exe" dist/release/
            fi
          fi

          # macOS (already zipped in the job to preserve metadata/permissions)
          find dist/artifacts -name 'dnsbench-macos-*.zip' -exec cp {} dist/release/ \;

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/release/* \
            --title "$TAG_NAME" \
            --notes "Unsigned DNSBench release artifacts."


